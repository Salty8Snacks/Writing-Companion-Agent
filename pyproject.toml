[project]
name = "writing-companion-agent"
version = "0.1.0"
description = "Study & Writing Companion: a college-level writing coach agent built on the Mistral Agents SDK"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents[bashkit,koyeb]>=1.1.2,<1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.mistralai.agents]
entrypoint = "main:agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
